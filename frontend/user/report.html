<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งเหตุ | CampusCare Incident Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="user.css">
</head>
<body>
  <div class="app">
    <!-- เมนูซ้ายและแถบบน: สร้างโดย mountShell() ใน shared.js -->
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก"></aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="page-head page-head--list">
          <div>
            <p class="eyebrow">My Reports</p>
            <h1>รายการของฉัน</h1>
            <p class="muted">ติดตามความคืบหน้าและประวัติการแจ้งเหตุของคุณ</p>
          </div>
        </section>

        <section class="hero-card">
          <div>
            <h2>พบเหตุหรือสิ่งผิดปกติ?</h2>
            <p>ส่งรายละเอียดและรูปภาพให้ทีมที่เกี่ยวข้องตรวจสอบ เจ้าหน้าที่จะติดต่อกลับหากต้องการข้อมูลเพิ่มเติม</p>
          </div>
          <button type="button" class="btn btn-primary btn-lg" data-action="new">
            <svg class="icon"><use href="#i-plus"/></svg>แจ้งเหตุใหม่
          </button>
        </section>

        <section class="stats stats--3" id="stats" aria-label="สรุปรายการของฉัน"></section>

        <section class="card" id="latestCard" aria-labelledby="latestTitle" hidden>
          <div class="card-head">
            <h2 class="card-title" id="latestTitle">ความคืบหน้าล่าสุด</h2>
            <span class="muted small" id="latestMeta"></span>
          </div>
          <div id="latestBody"></div>
        </section>

        <section class="card" aria-labelledby="historyTitle">
          <div class="card-head">
            <h2 class="card-title" id="historyTitle">ประวัติการแจ้งเหตุ</h2>
            <a class="link-arrow" href="history.html">ดูทั้งหมด<svg class="icon icon--xs"><use href="#i-arrow-right"/></svg></a>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">เลขที่</th>
                  <th scope="col">รายการเหตุ</th>
                  <th scope="col">ระดับ</th>
                  <th scope="col">สถานะ</th>
                  <th scope="col">ผู้รับผิดชอบ</th>
                </tr>
              </thead>
              <tbody id="previewBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- หน้าต่างป๊อปอัป (shared.js เติมเนื้อหาเมื่อเปิด) -->
  <dialog id="newDialog" aria-labelledby="newTitle"></dialog>
  <dialog id="detailDialog" class="sheet" aria-labelledby="detailTitle"></dialog>

  <script src="shared.js"></script>
  <script src="report.js"></script>
</body>
</html>
