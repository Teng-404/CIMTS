<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตารางเข้าเวร | CampusCare Incident Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="officer.css">
</head>
<body>
  <div class="app">
    <!-- เมนูซ้ายและแถบบน: สร้างโดย mountShell() ใน shared.js -->
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก"></aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="page-head page-head--list">
          <div>
            <p class="eyebrow">My Schedule</p>
            <h1>ตารางเข้าเวร</h1>
            <p class="muted">ตรวจสอบวันและเวลาเข้าเวรของคุณล่วงหน้า</p>
          </div>
        </section>

        <section class="card" aria-label="ตารางเข้าเวรรายสัปดาห์">
          <div class="card-head">
            <h2 class="card-title" id="weekLabel"></h2>
            <div class="week-nav" id="weekNav"></div>
          </div>
          <div class="week-grid" id="weekGrid"></div>
          <div class="card-foot" id="weekSummary"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- หน้าต่างป๊อปอัป (shared.js เติมเนื้อหาเมื่อเปิด แม้หน้านี้จะไม่เปิดเองก็ตาม เผื่อใช้ toast ร่วม) -->
  <dialog id="detailDialog" class="sheet" aria-labelledby="detailTitle"></dialog>
  <dialog id="updateDialog" aria-labelledby="updateTitle"></dialog>

  <script src="shared.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
