<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สถิติของฉัน | CampusCare Incident Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="officer.css">
</head>
<body>
  <div class="app">
    <!-- เมนูซ้ายและแถบบน: สร้างโดย mountShell() ใน shared.js -->
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก"></aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="page-head page-head--list">
          <div>
            <p class="eyebrow">My Stats</p>
            <h1>สถิติของฉัน</h1>
            <p class="muted">ภาพรวมผลงานและประสิทธิภาพการดำเนินงานของคุณ</p>
          </div>
        </section>

        <section class="stats" id="stats" aria-label="สรุปสถิติของฉัน"></section>

        <div class="grid-bottom grid-bottom--reports">
          <section class="card" aria-labelledby="catTitle">
            <div class="card-head">
              <h2 class="card-title" id="catTitle">สัดส่วนตามประเภทงาน</h2>
              <span class="muted small">ทั้งหมดของฉัน</span>
            </div>
            <div class="chart" id="categoryBody"></div>
          </section>

          <section class="card" aria-labelledby="statusTitle">
            <div class="card-head">
              <h2 class="card-title" id="statusTitle">สถานะงานทั้งหมด</h2>
              <span class="muted small">ทั้งหมดของฉัน</span>
            </div>
            <div id="statusBody"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- หน้าต่างป๊อปอัป (shared.js เติมเนื้อหาเมื่อเปิด) -->
  <dialog id="detailDialog" class="sheet" aria-labelledby="detailTitle"></dialog>
  <dialog id="updateDialog" aria-labelledby="updateTitle"></dialog>

  <script src="shared.js"></script>
  <script src="stats.js"></script>
</body>
</html>
