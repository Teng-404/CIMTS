<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการสถานที่ | CampusCare Incident Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app">
    <!-- เมนูซ้ายและแถบบน: สร้างโดย mountShell() ใน shared.js -->
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก"></aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="page-head page-head--list">
          <div>
            <p class="eyebrow">Locations</p>
            <h1>จัดการสถานที่</h1>
            <p class="muted">พื้นที่และอาคารที่เปิดให้เลือกตอนแจ้งเหตุ</p>
          </div>
          <div class="page-head-actions">
            <button type="button" class="btn btn-primary btn-lg" data-action="new-item">
              <svg class="icon"><use href="#i-plus"/></svg>เพิ่มสถานที่
            </button>
          </div>
        </section>

        <section class="stats stats--3" id="itemStats" aria-label="สรุปสถานที่"></section>

        <section class="card" aria-label="ตารางสถานที่">
          <div class="card-head">
            <h2 class="card-title">รายการสถานที่</h2>
            <span class="muted small" id="itemMeta"></span>
          </div>
          <div class="table-wrap">
            <table class="table table--list">
              <thead id="itemHead"></thead>
              <tbody id="itemBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- หน้าต่างป๊อปอัป (shared.js และสคริปต์ของหน้านี้เติมเนื้อหาเมื่อเปิด) -->
  <dialog id="assignDialog" aria-labelledby="assignTitle"></dialog>
  <dialog id="detailDialog" class="sheet" aria-labelledby="detailTitle"></dialog>
  <dialog id="newDialog" aria-labelledby="newTitle"></dialog>
  <dialog id="confirmDialog" class="dialog-sm" aria-labelledby="confirmTitle"></dialog>
  <dialog id="itemDialog" class="dialog-sm" aria-labelledby="itemFormTitle"></dialog>

  <script src="shared.js"></script>
  <script src="places.js"></script>
</body>
</html>
